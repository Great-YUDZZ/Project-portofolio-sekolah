# ==============================================================================
# Konfigurasi Nginx Server Block - Website Skensa Jaya (SMKN 1 Denpasar)
# Domain: yudzz-app.my.id & www.yudzz-app.my.id
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name yudzz-app.my.id www.yudzz-app.my.id;
    root /var/www/skensa-jaya/public;

    index index.php index.html;
    charset utf-8;
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Routing Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Logging optimizations
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # FastCGI PHP-FPM 8.4 Integration
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Static Assets Caching (Vite build, Images, Fonts)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Deny access to hidden dotfiles (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
